<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bondi Beach</title>

    <style>

        body {

            margin: 0;
            font-family: Arial, sans-serif;

            background:
            linear-gradient(to bottom right,
            #dff6ff, #ffffff);

            transition: 0.3s;

        }

        /* Dark Mode */
        .dark-mode {

            background: #121212;
            color: white;

        }

        .dark-mode .navbar {

            background: black;

        }

        .dark-mode .content {

            background: #1f1f1f;
            color: white;

        }

        /* Navbar */
        .navbar {

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #0077c2;

            padding: 15px 40px;

        }

        .logo {

            color: white;

        }

        .navbar ul {

            display: flex;
            gap: 20px;
            list-style: none;

        }

        .navbar ul li a {

            color: white;
            text-decoration: none;

        }

        .navbar ul li a:hover {

            color: #ffdd55;

        }

        #darkBtn {

            padding: 10px 15px;
            border: none;
            border-radius: 5px;

            background: #ffce00;

            cursor: pointer;

        }

        /* Content */
        .content {

            max-width: 900px;

            margin: 40px auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
            0 0 20px rgba(0,0,0,0.1);

            text-align: center;

        }

        .content img {

            width: 100%;

            max-height: 400px;

            object-fit: cover;

            border-radius: 10px;

        }

        .content h1 {

            color: #0077c2;

            margin-top: 20px;

        }

        .content p {

            font-size: 17px;

            line-height: 1.6;

        }

        .btn {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 25px;

            background: #0077c2;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            border: none;

            cursor: pointer;

        }

        .btn:hover {

            background: #005a8c;

        }

        #weatherText {

            margin-top: 20px;

            font-size: 18px;

            font-weight: bold;

            color: #0077c2;

        }

    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <h2 class="logo">
            Explore Sydney
        </h2>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="places.html">
                    Places to Visit
                </a>
            </li>

            <li>
                <a href="food.html">
                    Food & Culture
                </a>
            </li>

        </ul>

        <button id="darkBtn">
            Dark Mode
        </button>

    </nav>


    <!-- Content -->
    <div class="content">

        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80"
             alt="Bondi Beach">

        <h1>Bondi Beach</h1>

        <p>

            Bondi Beach is one of Australia's
            most famous beaches known for its
            golden sand and surfing culture.

        </p>

        <p>

            Visitors enjoy surfing, beach cafés,
            swimming, and the beautiful Bondi
            to Coogee coastal walk.

        </p>


        <!-- Weather Button -->
        <button id="weatherBtn"
                class="btn">

            Check Beach Weather

        </button>

        <p id="weatherText"></p>


        <!-- Back Button -->
        <a href="places.html"
           class="btn">

           Back to Places

        </a>

    </div>


    <script>

        // Dark Mode
        const darkBtn =
        document.getElementById("darkBtn");


        if(localStorage.getItem("theme")
           === "dark"){

            document.body.classList
            .add("dark-mode");

        }


        darkBtn.addEventListener(

            "click",

            function(){

                document.body.classList
                .toggle("dark-mode");

                if(document.body.classList
                   .contains("dark-mode")){

                    localStorage.setItem(
                        "theme",
                        "dark"
                    );

                }

                else {

                    localStorage.setItem(
                        "theme",
                        "light"
                    );

                }

            }

        );


        // Weather Conditions
        const weather = [

            "Sunny ☀️ Perfect beach day!",

            "Windy 🌬️ Great for surfing!",

            "Cloudy ☁️ Calm beach weather.",

            "Hot 🔥 Don't forget sunscreen!",

            "Big Waves 🌊 Surf conditions are amazing!"

        ];


        // Weather Button
        const weatherBtn =
        document.getElementById("weatherBtn");

        const weatherText =
        document.getElementById("weatherText");


        weatherBtn.addEventListener(

            "click",

            function(){

                let random = Math.floor(

                    Math.random() * weather.length

                );

                weatherText.innerHTML =
                weather[random];

            }

        );


        // Array Example
        const activities = [

            "Surfing",

            "Swimming",

            "Walking",

            "Photography"

        ];


        // for...of Loop
        for(let activity of activities){

            console.log(activity);

        }


        // map() Example
        let upperActivities =
        activities.map(function(activity){

            return activity.toUpperCase();

        });

        console.log(upperActivities);


        // Object Example
        const beach = {

            name: "Bondi Beach",

            country: "Australia",

            famousFor: "Surfing"

        };


        // Destructuring
        const {name, country, famousFor} =
        beach;

        console.log(name);
        console.log(country);
        console.log(famousFor);


        // JSON Example
        let jsonData =
        JSON.stringify(beach);

        console.log(jsonData);


        // Parse JSON
        let objectData =
        JSON.parse(jsonData);

        console.log(objectData);


        // Arrow Function
        const welcome = () => {

            console.log(
                "Welcome to Bondi Beach!"
            );

        };

        welcome();


        // Timer Example
        setTimeout(function(){

            console.log(
                "Enjoy the beach view!"
            );

        }, 2000);

    </script>

</body>
</html>
